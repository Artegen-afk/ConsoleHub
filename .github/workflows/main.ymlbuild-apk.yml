name: Build ConsoleHub APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - run: dotnet publish ./ConsoleHub.Android/ConsoleHub.Android.csproj -f net10.0-android -c Release -o ./apk_pronto
      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleHub-Android-APK
          path: ./apk_pronto/*.apk
