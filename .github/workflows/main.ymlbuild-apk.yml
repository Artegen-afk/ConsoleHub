name: Build ConsoleHub APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo dotnet workload install android
      - run: dotnet build ./ConsoleHub.Android/ConsoleHub.Android.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSdkLicenses=True
      - run: dotnet publish ./ConsoleHub.Android/ConsoleHub.Android.csproj -f net10.0-android -c Release
      - run: ls -lh ./ConsoleHub.Android/bin/Release/net10.0-android/publish/
      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleHub-Android-APK
          path: ./ConsoleHub.Android/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
